<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="ロードマップ：構想、PoC、Prototype、MVP、Staging、Release、運用・改善。いまは構想の段階">
  <defs>
    <style>
      text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif}
      .track{stroke:#2b3542;stroke-width:8;stroke-linecap:round}
      .prog{stroke:#f0a447;stroke-width:8;stroke-linecap:round;stroke-dasharray:1040;stroke-dashoffset:1040;animation:draw 6s ease-in-out infinite}
      @keyframes draw{0%{stroke-dashoffset:1040}70%,100%{stroke-dashoffset:0}}
      .gate{transform-box:fill-box;transform-origin:center;animation:gate 2s ease-in-out infinite}
      .g1{animation-delay:.3s}.g2{animation-delay:.6s}.g3{animation-delay:.9s}.g4{animation-delay:1.2s}
      @keyframes gate{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(45deg) scale(1.18)}}
      .here{animation:bounce 1.2s ease-in-out infinite}
      @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .now{animation:glow 1.6s ease-in-out infinite}
      @keyframes glow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.2}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#0f1d31"/>
  <text x="36" y="42" font-size="18" font-weight="800" fill="#ffffff">🗺️ ロードマップ：ゲートで「進む・止める」を決めながら育てる</text>
  <line class="track" x1="100" y1="140" x2="1110" y2="140"/>
  <line class="prog" x1="100" y1="140" x2="1110" y2="140"/>

  <!-- ゲート -->
  <g fill="#f0a447">
    <rect class="gate"    x="181" y="134" width="12" height="12"/>
    <rect class="gate g1" x="356" y="134" width="12" height="12"/>
    <rect class="gate g2" x="531" y="134" width="12" height="12"/>
    <rect class="gate g3" x="706" y="134" width="12" height="12"/>
    <rect class="gate g4" x="881" y="134" width="12" height="12"/>
  </g>
  <g font-size="11" font-weight="800" fill="#f0a447" text-anchor="middle"><text x="187" y="120">G0</text><text x="362" y="120">G1</text><text x="537" y="120">G2</text><text x="712" y="120">G3</text><text x="887" y="120">G4</text></g>

  <!-- 段階 -->
  <g text-anchor="middle">
    <circle cx="100" cy="140" r="26" fill="#3a2a12" stroke="#f0a447" stroke-width="3"/>
    <circle class="now" cx="100" cy="140" r="34" fill="none" stroke="#f0a447" stroke-width="2"/>
    <text x="100" y="150" font-size="26">💭</text>
    <circle cx="275" cy="140" r="26" fill="#16294a" stroke="#4c6584" stroke-width="3"/><text x="275" y="150" font-size="26">🧪</text>
    <circle cx="450" cy="140" r="26" fill="#16294a" stroke="#4c6584" stroke-width="3"/><text x="450" y="150" font-size="26">🧩</text>
    <circle cx="625" cy="140" r="26" fill="#16294a" stroke="#4c6584" stroke-width="3"/><text x="625" y="150" font-size="26">🚧</text>
    <circle cx="800" cy="140" r="26" fill="#16294a" stroke="#4c6584" stroke-width="3"/><text x="800" y="150" font-size="26">🛡️</text>
    <circle cx="975" cy="140" r="26" fill="#16294a" stroke="#4c6584" stroke-width="3"/><text x="975" y="150" font-size="26">🚀</text>
    <circle cx="1110" cy="140" r="26" fill="#16294a" stroke="#4c6584" stroke-width="3"/><text x="1110" y="150" font-size="26">🔄</text>

    <g font-size="15" font-weight="800" fill="#ffffff">
      <text x="100" y="196">構想</text><text x="275" y="196">PoC</text><text x="450" y="196">Prototype</text><text x="625" y="196">MVP</text><text x="800" y="196">Staging</text><text x="975" y="196">Release</text><text x="1110" y="196">運用・改善</text>
    </g>
    <g font-size="12" fill="#c3cfdf">
      <text x="100" y="218">価値はある？</text><text x="275" y="218">技術でできる？</text><text x="450" y="218">使いこなせる？</text><text x="625" y="218">本当に使われる？</text><text x="800" y="218">安全に動く？</text><text x="975" y="218">正式に届ける</text><text x="1110" y="218">もっと良く</text>
    </g>
    <g font-size="11" fill="#7f93b0">
      <text x="100" y="240">〜2026/10</text><text x="275" y="240">2026/11〜12</text><text x="450" y="240">2027/01</text><text x="625" y="240">2027/02〜04</text><text x="800" y="240">2027/05〜06</text><text x="975" y="240">2027/07</text><text x="1110" y="240">2027/07〜</text>
    </g>
  </g>

  <!-- いまここ -->
  <g class="here">
    <rect x="58" y="62" width="84" height="28" rx="14" fill="#f0a447"/>
    <text x="100" y="81" font-size="13" font-weight="800" fill="#0f1d31" text-anchor="middle">📍 いまここ</text>
    <path d="M94,90 L100,98 L106,90 z" fill="#f0a447"/>
  </g>
  <text x="600" y="278" font-size="12" fill="#98a4b6" text-anchor="middle">◆ ゲート：基準を満たしたら次へ。満たさなければ「やり直す・方向を変える・やめる」を判断します</text>
</svg>
