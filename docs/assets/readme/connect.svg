<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="いまはバラバラの情報を、ひとつの画面にまとめる">
  <defs>
    <style>
      text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif}
      .wob{transform-box:fill-box;transform-origin:center;animation:wob 3s ease-in-out infinite}
      .d2{animation-delay:.4s}.d3{animation-delay:.8s}.d4{animation-delay:1.2s}
      @keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
      .flow{fill:none;stroke:#f0a447;stroke-width:3;stroke-dasharray:8 10;animation:dash 1s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-36}}
      .tile{animation:lit 4s ease-in-out infinite}
      .t2{animation-delay:1s}.t3{animation-delay:2s}.t4{animation-delay:3s}
      @keyframes lit{0%,100%{fill-opacity:.25}20%{fill-opacity:.95}45%{fill-opacity:.25}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#0f1d31"/>
  <text x="200" y="44" font-size="20" font-weight="800" fill="#ee7070" text-anchor="middle">😣 いま：情報がバラバラ</text>
  <text x="930" y="44" font-size="20" font-weight="800" fill="#47c07c" text-anchor="middle">😊 これから：ひとつの画面</text>

  <g text-anchor="middle" font-size="14" fill="#e6ebf2">
    <g class="wob"><rect x="40" y="76" width="150" height="86" rx="12" fill="#16294a" stroke="#4c6584"/><text x="115" y="118" font-size="30">📊</text><text x="115" y="148">工程表（Excel）</text></g>
    <g class="wob d2"><rect x="214" y="70" width="150" height="86" rx="12" fill="#16294a" stroke="#4c6584"/><text x="289" y="112" font-size="30">📱</text><text x="289" y="142">LINE・写真</text></g>
    <g class="wob d3"><rect x="40" y="186" width="150" height="86" rx="12" fill="#16294a" stroke="#4c6584"/><text x="115" y="228" font-size="30">🏢</text><text x="115" y="258">原価のシステム</text></g>
    <g class="wob d4"><rect x="214" y="194" width="150" height="86" rx="12" fill="#16294a" stroke="#4c6584"/><text x="289" y="236" font-size="30">📝</text><text x="289" y="266">紙の日報</text></g>
  </g>

  <path class="flow" d="M368,112 C470,112 520,150 600,160"/>
  <path class="flow" d="M368,236 C470,236 520,176 600,168"/>
  <path class="flow" d="M560,164 L600,164" style="animation-duration:.8s"/>

  <!-- 真ん中：SiteLive Twin -->
  <g text-anchor="middle">
    <circle cx="660" cy="164" r="58" fill="#f0a447" fill-opacity=".15" stroke="#f0a447" stroke-width="2"/>
    <text x="660" y="160" font-size="30">🔗</text>
    <text x="660" y="190" font-size="13" font-weight="800" fill="#ffd9a6">つなぐ</text>
  </g>
  <path class="flow" d="M720,164 L790,164"/>

  <!-- 右：ひとつの画面 -->
  <g>
    <rect x="800" y="70" width="260" height="196" rx="14" fill="#16294a" stroke="#9dbbe2"/>
    <rect x="800" y="70" width="260" height="30" rx="14" fill="#1f3a63"/>
    <circle cx="820" cy="85" r="5" fill="#ee7070"/><circle cx="836" cy="85" r="5" fill="#e2bb3a"/><circle cx="852" cy="85" r="5" fill="#47c07c"/>
    <text x="870" y="90" font-size="13" font-weight="700" fill="#e6ebf2">SiteLive Twin</text>
    <rect class="tile"    x="814" y="112" width="114" height="68" rx="8" fill="#6aa0ef"/>
    <rect class="tile t2" x="934" y="112" width="114" height="68" rx="8" fill="#47c07c"/>
    <rect class="tile t3" x="814" y="186" width="114" height="68" rx="8" fill="#f0a447"/>
    <rect class="tile t4" x="934" y="186" width="114" height="68" rx="8" fill="#e2bb3a"/>
    <g text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">
      <text x="871" y="152">📅 工程</text><text x="991" y="152">🚜 現場の様子</text><text x="871" y="226">💴 原価</text><text x="991" y="226">📝 日報</text>
    </g>
  </g>
  <text x="1130" y="150" font-size="34" text-anchor="middle">👥</text>
  <text x="1130" y="182" font-size="12" fill="#98a4b6" text-anchor="middle">みんなで</text>
  <text x="1130" y="198" font-size="12" fill="#98a4b6" text-anchor="middle">同じ画面</text>
</svg>
