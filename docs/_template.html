<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteLive Twin 文書名</title>
<style>
/* SiteLive Twin 文書テンプレート：左に目次、右に本文。表と図は横スクロール可能な枠に入れる */
:root{
  --bg:#f5f6f8; --paper:#ffffff; --ink:#1a2230; --sub:#5a6577; --rule:#d9dee6; --tint:#f0f3f7;
  --navy:#1b3557; --accent:#c8740a; --accent-soft:#fdf1e1;
  --ok:#1d8a4c; --warn:#a87800; --ng:#c43d3d; --info:#2a64a8;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:"BIZ UDGothic","Consolas","Menlo",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --paper:#151c25; --ink:#e4e9f0; --sub:#9aa6b7; --rule:#2b3542; --tint:#1b2430;
    --navy:#9dbbe2; --accent:#f0a447; --accent-soft:#38280f;
    --ok:#47c07c; --warn:#e2bb3a; --ng:#ee7070; --info:#6fa8ea; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --paper:#151c25; --ink:#e4e9f0; --sub:#9aa6b7; --rule:#2b3542; --tint:#1b2430;
  --navy:#9dbbe2; --accent:#f0a447; --accent-soft:#38280f;
  --ok:#47c07c; --warn:#e2bb3a; --ng:#ee7070; --info:#6fa8ea; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1280px;margin:0 auto;gap:28px;padding:28px 16px 60px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:0}}
nav.toc{position:sticky;top:20px;align-self:start;font-size:13px;max-height:calc(100vh - 40px);overflow:auto}
@media (max-width:900px){nav.toc{position:static;max-height:none;margin-bottom:18px}}
.toc b{display:block;font-size:11px;letter-spacing:.12em;color:var(--sub);margin-bottom:6px}
.toc a{display:block;color:var(--ink);text-decoration:none;padding:3px 10px;border-left:2px solid var(--rule)}
.toc a:hover,.toc a:focus-visible{border-left-color:var(--accent);color:var(--accent);outline:none}
.toc .home{margin-bottom:12px;border-left:0;padding-left:0;color:var(--info)}
main{min-width:0}
.cover{background:var(--paper);border:1px solid var(--rule);border-top:5px solid var(--navy);border-radius:6px;padding:26px 28px 20px;margin-bottom:26px}
.cover .kind{font-size:12px;letter-spacing:.14em;color:var(--sub);font-weight:700}
.cover h1{margin:4px 0 14px;font-size:clamp(22px,3.4vw,30px);line-height:1.35;text-wrap:balance;color:var(--navy)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule);font-size:13px}
.meta div{padding:7px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.meta span{display:block;font-size:11px;color:var(--sub)}
section{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:22px 26px 18px;margin-bottom:20px;min-width:0}
h2{font-size:19px;margin:0 0 12px;color:var(--navy);text-wrap:balance;display:flex;gap:10px;align-items:baseline}
h2 .no{font-family:var(--mono);font-size:14px;color:var(--accent)}
h3{font-size:15px;margin:20px 0 8px}
p{margin:0 0 10px;max-width:76ch}
ul,ol{margin:0 0 10px;padding-left:22px}
li{margin-bottom:3px}
.tbl{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--rule);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:7px 9px;text-align:left;vertical-align:top}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
thead th{background:var(--tint);font-size:12px;color:var(--sub);white-space:nowrap}
td.c,th.c{text-align:center}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
code,.id{font-family:var(--mono);font-size:12.5px}
.id{color:var(--navy);font-weight:700;white-space:nowrap}
.y{color:var(--ok);font-weight:800}.n{color:var(--sub)}.r{color:var(--warn);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:3px;background:var(--tint);border:1px solid var(--rule);white-space:nowrap;margin:1px 2px 1px 0}
.tag.a{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.st{display:inline-block;font-size:11px;font-weight:800;padding:0 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.st.done{color:var(--ok)}.st.wip{color:var(--accent)}.st.todo{color:var(--sub)}.st.tpl{color:var(--info)}
.note{font-size:12.5px;color:var(--sub)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 4px 4px 0;margin:8px 0 12px;font-size:13.5px}
.fill{background:var(--tint);border:1px dashed var(--rule);border-radius:4px;padding:2px 8px;color:var(--sub);font-size:12.5px}
.fig{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:var(--tint);padding:10px;margin:8px 0 6px}
.fig svg{display:block;min-width:760px;width:100%;height:auto}
.fig text{font-family:var(--sans)}
.cap{font-size:12px;color:var(--sub);margin:0 0 12px}
.pri-h{color:var(--ng);font-weight:800}.pri-m{color:var(--warn);font-weight:800}.pri-l{color:var(--sub);font-weight:800}.pri-done{color:var(--ok);font-weight:800}
a{color:var(--info)}
footer{font-size:12px;color:var(--sub);padding:6px 4px}
@media (max-width:640px){section{padding:18px 16px 14px}.cover{padding:20px 16px 16px}}
@media print{nav.toc{display:none}.wrap{display:block;padding:0}section,.cover{break-inside:avoid;border:0}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
<nav class="toc" aria-label="目次">
  <a class="home" href="../index.html">← ドキュメント一覧</a>
  <b>目次</b>
  <a href="#s1">1. 見出し</a>
</nav>
<main>
<div class="cover">
  <div class="kind">文書の種類</div>
  <h1>SiteLive Twin（現場ライブツイン）<br>文書名</h1>
  <div class="meta">
    <div><span>文書番号</span>SLT-DOC-00</div>
    <div><span>版</span>v0.1</div>
    <div><span>作成日</span>2026年10月21日</div>
    <div><span>フェーズ</span>共通</div>
    <div><span>状態</span>初版</div>
  </div>
</div>
<section id="s1">
  <h2><span class="no">1</span>見出し</h2>
  <p>本文</p>
</section>
<footer>SiteLive Twin（現場ライブツイン） ／ 文書名 v0.1 ／ 2026年10月21日</footer>
</main>
</div>
</body>
</html>
