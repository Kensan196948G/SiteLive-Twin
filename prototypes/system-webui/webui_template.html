<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現場ライブツイン システム</title>
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface2:#f4f6f9; --text:#18212e; --muted:#5d6878; --line:#dde2ea;
  --primary:#1f5fbf; --primary-soft:#e6eefb; --accent:#e8890c; --accent-soft:#fff1dc;
  --ok:#1f9d55; --warn:#c08a00; --ng:#d64545; --info:#2f6fb3; --plan:#a9bcd3;
  --nav:#0f1d31; --nav2:#16294a; --navtext:#c3cfdf;
  --shadow:0 1px 2px rgba(20,30,50,.05),0 2px 10px rgba(20,30,50,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1117; --surface:#151c26; --surface2:#1b2430; --text:#e6ebf2; --muted:#98a4b6; --line:#2a3443;
    --primary:#6aa0ef; --primary-soft:#1c2b44; --accent:#f3a33a; --accent-soft:#3a2a12;
    --ok:#3fbf75; --warn:#e8bf2a; --ng:#ef6a6a; --info:#6aa6e8; --plan:#4c6584;
    --nav:#0a121d; --nav2:#13203a; --navtext:#b4c1d3;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#151c26; --surface2:#1b2430; --text:#e6ebf2; --muted:#98a4b6; --line:#2a3443;
  --primary:#6aa0ef; --primary-soft:#1c2b44; --accent:#f3a33a; --accent-soft:#3a2a12;
  --ok:#3fbf75; --warn:#e8bf2a; --ng:#ef6a6a; --info:#6aa6e8; --plan:#4c6584;
  --nav:#0a121d; --nav2:#13203a; --navtext:#b4c1d3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:0 0 18px}

/* ログイン */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 20% 10%,#1f3a63 0,#0f1d31 55%,#0a1322 100%)}
.lcard{width:100%;max-width:460px;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:28px}
.lbrand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lbrand .logo{width:44px;height:44px;font-size:16px}
.lcard h1{font-size:20px;margin:0}
.lcard .lsub{color:var(--muted);font-size:13px;margin:0 0 16px}
.acc{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.acc:hover{border-color:var(--primary)}
.acc.on{border-color:var(--primary);background:var(--primary-soft)}
.acc input{accent-color:var(--primary)}
.acc small{display:block;color:var(--muted);font-size:12px}
.lnote{font-size:12px;color:var(--muted);margin-top:14px;padding:10px 12px;background:var(--surface2);border-radius:8px}

/* アプリ枠 */
.app{display:grid;grid-template-columns:var(--nw,248px) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s}
.app.collapsed{--nw:68px}
.snav{position:sticky;top:0;height:100vh;background:var(--nav);color:var(--navtext);display:flex;flex-direction:column;overflow:hidden;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}
.logo{width:36px;height:36px;border-radius:9px;background:#e8890c;color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;flex:0 0 auto}
.brand b{color:#fff;font-size:14px;display:block;line-height:1.25}
.brand small{font-size:11px;color:#8ea1bb}
.navlist{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 8px 12px}
.ngrp{font-size:11px;font-weight:700;letter-spacing:.06em;color:#7f93b0;padding:12px 10px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--navtext);padding:8px 10px;border-radius:8px;text-align:left;white-space:nowrap;position:relative}
.nitem:hover{background:rgba(255,255,255,.06);color:#fff}
.nitem.on{background:var(--nav2);color:#fff}
.nitem.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:#e8890c}
.nitem .nb{margin-left:auto;background:#d64545;color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:0 6px;line-height:1.6}
.snav-foot{padding:10px;border-top:1px solid rgba(255,255,255,.07)}
.snav-foot button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#8ea1bb;padding:7px 10px;border-radius:8px;white-space:nowrap}
.snav-foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.app.collapsed .brand > div:not(.logo),.app.collapsed .ngrp,.app.collapsed .nitem span,.app.collapsed .snav-foot span{display:none}
.app.collapsed .nitem{justify-content:center}
.app.collapsed .nitem .nb{position:absolute;top:2px;right:4px}
.app.collapsed .ngrp{height:10px;padding:0}

.mainc{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{color:var(--text)}
.tb-sp{flex:1}
.tb-search{position:relative;width:min(320px,30vw)}
.tb-search input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 10px 7px 32px}
.tb-search .ic{position:absolute;left:9px;top:9px;color:var(--muted);width:16px;height:16px}
.sdrop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:360px;overflow:auto;z-index:50}
.sdrop button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:transparent;padding:8px 12px;text-align:left}
.sdrop button:hover,.sdrop button.hl{background:var(--surface2)}
.sdrop small{color:var(--muted);margin-left:auto;font-size:11px;white-space:nowrap}
.tb-btn{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;white-space:nowrap}
.tb-btn:hover{background:var(--surface2)}
.tb-btn .badge{position:absolute;top:-6px;right:-6px;background:#d64545;color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:0 5px;line-height:1.6;min-width:18px;text-align:center}
.feed .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:live 1.8s infinite}
.feed.off .dot{background:var(--muted);animation:none}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.feed small{color:var(--muted);font-size:11px}
.av{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.ubtn{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:2px 4px;border-radius:8px;text-align:left;line-height:1.25}
.ubtn:hover{background:var(--surface2)}
.ubtn small{display:block;color:var(--muted);font-size:11px}
.pop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.18);z-index:60;min-width:280px;padding:12px}
.popwrap{position:relative}
.pop h4{margin:0 0 8px;font-size:13px}
.nlist{max-height:380px;overflow:auto;margin:0 -12px}
.nrow{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.nrow:hover{background:var(--surface2)}
.nrow.unread{background:var(--primary-soft)}
.nrow .d{font-size:11px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 9px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--primary);color:#fff;font-weight:700}

.page{padding:18px 20px 40px;max-width:1560px;width:100%;margin:0 auto}
.page.enter{animation:pin .3s ease-out}
@keyframes pin{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.ph1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph1 h1{font-size:21px;margin:0;line-height:1.3}
.ph1 p{margin:2px 0 0;color:var(--muted);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:8px;padding:7px 14px;font-weight:700}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sub{background:var(--surface);color:var(--text);border-color:var(--line);font-weight:600}
.btn.sub:hover{background:var(--surface2)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.ng{background:var(--ng);border-color:var(--ng)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ch b{font-size:14px}
.ch small{color:var(--muted);font-size:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;margin-bottom:14px}
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11px;color:var(--muted)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini .kpi{box-shadow:none;padding:8px 10px}
.mini .kpi .v{font-size:18px}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-ng{color:var(--ng)}.c-info{color:var(--info)}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.pill{display:inline-block;font-size:11px;padding:0 8px;border-radius:999px;font-weight:700;white-space:nowrap;line-height:1.75}
.p-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-ng{background:color-mix(in srgb,var(--ng) 15%,transparent);color:var(--ng)}
.p-idle{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.p-info{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface2);white-space:nowrap}
th.sort{cursor:pointer}
th.sort:hover{color:var(--text)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
tr.sel td{background:var(--primary-soft)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.in,select.in{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface)}
textarea.in{width:100%;min-height:70px;resize:vertical}
.tabs2{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs2 button{border:0;background:transparent;padding:8px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
.tabs2 button.on{color:var(--primary);border-bottom-color:var(--primary)}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.alerts li:last-child{border-bottom:0}
.alerts .d{font-size:12px;color:var(--muted);white-space:nowrap;min-width:62px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.prow{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.prow .bars{display:flex;flex-direction:column;gap:3px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.lock{font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}

/* 3D */
.twin{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}
@media (max-width:1150px){.twin{grid-template-columns:1fr}}
.cv{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface2)}
.cv canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.cv canvas:active{cursor:grabbing}
.cv.big{height:clamp(380px,calc(100vh - 190px),780px)}
.cv.half{height:340px}
.ov{position:absolute;pointer-events:none;font-size:12px}
.ov > *{pointer-events:auto}
.ov.tl{left:10px;top:10px}.ov.bl{left:10px;bottom:10px}.ov.br{right:10px;bottom:10px}
.glass{background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;backdrop-filter:blur(4px)}
.lg{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.mtbl td{padding:5px 6px;font-size:12px}
.mtbl tr{cursor:pointer}
.mtbl tr:hover td{background:var(--surface2)}
.detail{font-size:13px;background:var(--surface2);border-radius:8px;padding:8px 10px}
.gantt{width:100%;height:auto;display:block;user-select:none}
.gantt text{font-size:12px;fill:var(--text)}
.gantt .g-tick{font-size:10px;fill:var(--muted)}
.gantt .g-grid{stroke:var(--line);stroke-width:1}
.gantt .g-plan{fill:var(--plan)}
.ctl4d{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ctl4d input[type=range]{flex:1;min-width:200px;accent-color:var(--primary)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-size:10.5px;fill:var(--muted)}

/* 対策シミュレーション */
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--primary)}
.opt.on{border-color:var(--primary);background:var(--primary-soft)}
.opt.dis{opacity:.6;cursor:default}
.opt input{margin-top:4px;width:17px;height:17px;accent-color:var(--primary)}
.opt .t{font-weight:700}
.opt .d{font-size:12px;color:var(--muted)}
.verdict{margin-top:10px;padding:10px 12px;border-radius:8px;font-weight:700;font-size:13px}
.v-ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.v-warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.v-ng{background:color-mix(in srgb,var(--ng) 13%,transparent);color:var(--ng)}
.badge{font-size:11px;font-weight:800;padding:0 7px;border-radius:5px;margin-left:4px;white-space:nowrap}
.b-cost{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.b-time{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
#wiTimeline svg{width:100%;height:auto;display:block}
#wiTimeline text{font-size:11px;fill:var(--text)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px}
.fld > span{font-size:12px;color:var(--muted);font-weight:700}
.fld .err{color:var(--ng);font-size:12px}

/* ドロワー・モーダル */
.scrim{position:fixed;inset:0;background:rgba(8,14,22,.45);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:81;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:din .25s ease-out}
@keyframes din{0%{transform:translateX(40px);opacity:0}100%{transform:none;opacity:1}}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dh h2{margin:0;font-size:17px}
.db{padding:14px 18px;overflow:auto;flex:1}
.df{padding:12px 18px;border-top:1px solid var(--line)}
.sec{margin-bottom:14px}
.sec h3{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 10px 10px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--surface)}
.tl li.ok::before{background:var(--ok)}.tl li.ng::before{background:var(--ng)}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:90;padding:16px;background:rgba(8,14,22,.5)}
.mbox{background:var(--surface);border-radius:14px;width:100%;max-width:640px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pin .25s ease-out}
.mbox .dh,.mbox .db,.mbox .df{padding-left:20px;padding-right:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f1d31;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;transition:.25s;z-index:120;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sens{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.sens .card .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}

#btnMenu{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .snav{position:fixed;left:0;top:0;width:248px;transform:translateX(-100%);transition:transform .25s}
  .app.mopen .snav{transform:none;box-shadow:10px 0 40px rgba(0,0,0,.35)}
  .app.collapsed .brand > div:not(.logo),.app.collapsed .ngrp,.app.collapsed .nitem span{display:revert}
  #btnMenu{display:inline-flex}
  #btnCollapse{display:none!important}
  .tb-search{display:none}
  .topbar{padding:8px 10px;gap:6px;flex-wrap:wrap}
  .crumb{order:10;width:100%}
  .ubtn .un{display:none}
  .page{padding:12px 10px 30px}
}
@media print{
  .snav,.topbar,.acts,.noprint{display:none!important}
  .app{display:block}
  body{background:#fff}

<script>
(function(){
'use strict';
//@@A

/* ================= 状態・保存 ================= */
const STORE = 'slt-system-webui-v1';
const DEFAULT_T = new Date(2026, 9, 21, 8, 0).getTime();
const DEFAULT_CFG = {spiWarn:.95, spiNg:.8, utilWarn:.6, notify:{delay:true, util:true, approval:true, safety:true}};
const S = {scn:'delay', t:DEFAULT_T, playing:true, speed:300, decisions:[], requests:[], dailies:[], audit:[], notifs:[], notifRead:[],
  cfg: JSON.parse(JSON.stringify(DEFAULT_CFG)), user:null, collapsed:false,
  page:'dash', compare:false, sel:null, whatif:new Set(['dump','crew']), draftTitle:'', draftComment:'', play4d:false, apprTab:'pending', siteSort:{k:'id', d:1}};
const PERSIST = ['scn','t','speed','decisions','requests','dailies','audit','notifs','notifRead','cfg','user','collapsed'];
try{
  const j = JSON.parse(localStorage.getItem(STORE) || 'null');
  if(j) PERSIST.forEach(p => { if(j[p] !== undefined) S[p] = j[p]; });
  S.cfg = Object.assign({}, DEFAULT_CFG, S.cfg); S.cfg.notify = Object.assign({}, DEFAULT_CFG.notify, S.cfg.notify);
}catch(e){}
function save(){ try{ const o = {}; PERSIST.forEach(p => o[p] = S[p]); localStorage.setItem(STORE, JSON.stringify(o)); }catch(e){} }

function nowInfo(){
  const dt = new Date(S.t); const key = k(dt);
  const h = dt.getHours() + dt.getMinutes()/60;
  return {dt, key, h, minute: dt.getHours()*60 + dt.getMinutes() + dt.getSeconds()/60, frac: clamp((h-8)/9, 0, 1), tomorrow: k(addDays(dt,1)), hm: pad(dt.getHours())+':'+pad(dt.getMinutes())};
}
function activeOpts(key){
  const s = new Set();
  for(const d of S.decisions){ if(!d.archived && d.scn === S.scn && d.effective <= key) d.options.forEach(o => s.add(o)); }
  return s;
}
let ACT = null, FC = null, ALERTS = [], TREND = [];
const dirty = {all:true};
function forecast(extra){
  const nf = nowInfo();
  const optsAt = key => { const s = activeOpts(key); extra.forEach(o => s.add(o)); return s; };
  const r = simulate({scn:S.scn, from:nf.tomorrow, init:{prog:ACT.prog, cost:ACT.cost, optCost:ACT.optCost, pcCharged:ACT.pcCharged}, optsAt, noise:false});
  const all = ACT.recs.concat(r.recs);
  const sp = spans(all);
  const finish = sp.fin.f || END_KEY;
  return {recs:r.recs, all, sp, finish, eac: r.cost + r.optCost + indirect(finish) + ldCost(finish), optAdd: r.optCost - ACT.optCost, optTotal: r.optCost};
}
function recompute(){
  const nf = nowInfo();
  ACT = simulate({scn:S.scn, from:START_KEY, init:ZERO(), optsAt:activeOpts, noise:true, until:nf.key});
  FC = forecast(EMPTY);
  ALERTS = computeAlerts();
  TREND = ACT.recs.filter(r => r.key < nf.key).map(r => ({key:r.key, spi: evmAt(r.key, 1).SPI}));
  dirty.all = true;
}
//@@B

/* ================= ユーザー・権限・監査・通知 ================= */
const USERS = [
  {id:'exec',  name:'支店長',         org:'○○支店',   role:'exec',  ini:'支'},
  {id:'gm',    name:'工事部長',       org:'○○支店 工事部', role:'exec', ini:'部'},
  {id:'pm',   name:'現場所長',       org:'A現場',    role:'pm',    ini:'所'},
  {id:'eng',   name:'工務担当',       org:'A現場',    role:'eng',   ini:'工'},
  {id:'admin', name:'システム管理者', org:'DX推進部', role:'admin', ini:'管'},
];
const ROLE_NAME = {exec:'経営層', pm:'現場所長', eng:'工務', admin:'システム管理者'};
const PERM = {view:['exec','pm','eng','admin'], draft:['exec','pm','eng'], approve:['exec'], daily:['pm','eng'], settings:['admin']};
const PERM_NAME = {view:'閲覧', draft:'対策の起案', approve:'承認・差戻し', daily:'日報の作成', settings:'設定の変更・リセット'};
const me = () => USERS.find(u => u.id === S.user);
const can = p => !!me() && PERM[p].indexOf(me().role) >= 0;
// 職務分掌：起案者本人は承認・差戻しできない（createdById がない旧データは名前で判定）
const isOwnRequest = r => !!me() && (r.createdById ? r.createdById === me().id : r.createdBy === me().name);
const canDecide = r => r.status === 'pending' && can('approve') && !isOwnRequest(r) && r.scn === S.scn;
function audit(action, target, detail){
  const nf = nowInfo(), u = me();
  S.audit.push({ts:new Date().toISOString(), sim:nf.key+' '+nf.hm, user:u ? u.name : '—', role:u ? ROLE_NAME[u.role] : '', action, target:target||'', detail:detail||''});
  if(S.audit.length > 600) S.audit.splice(0, S.audit.length - 600);
  save();
}
function notify(text, lv, link, kind){
  const nf = nowInfo();
  S.notifs.push({id:'n'+Date.now().toString(36)+Math.floor(Math.random()*1e4), key:nf.key, hm:nf.hm, text, lv, link, kind:kind||'approval', scn:S.scn});
  if(S.notifs.length > 150) S.notifs.shift();
  save();
}
function allNotifs(){
  const cfg = S.cfg.notify;
  const a = ALERTS.filter(x => x.lv !== 'info').filter(x => (/BH-01/.test(x.text) ? cfg.util : cfg.delay)).map(x => ({id:'a'+x.key+'|'+x.text, key:x.key, text:'A現場：'+x.text, lv:x.lv, link:'overview'}));
  const s = safetyEvents().filter(() => cfg.safety).map(x => ({id:'s'+x.key+'|'+x.text, key:x.key, text:'A現場：'+x.text, lv:x.lv, link:'safety'}));
  const w = S.notifs.filter(n => n.scn === S.scn && cfg.approval).map(n => ({id:n.id, key:n.key, text:n.text, lv:n.lv, link:n.link}));
  return a.concat(s, w).sort((x, y) => x.key < y.key ? 1 : x.key > y.key ? -1 : 0);
}

/* ================= 共通UI部品 ================= */

  list:'M8 6h13 M8 12h13 M8 18h13 M3.5 6h.01 M3.5 12h.01 M3.5 18h.01',

const icon = (n, cls) => `<svg class="ic ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;

/* SVG折れ線グラフ（日付軸） */
function lineChart(o){
  const W = o.w || 640, H = o.h || 200, L = 44, R = 14, T = o.legend ? 32 : 12, B = 24;
  const days = Math.max(1, calDiff(o.x0, o.x1));
  const X = key => L + (W-L-R) * clamp(calDiff(o.x0, key), 0, days)/days;
  const Y = v => T + (H-T-B) * (o.yMax - clamp(v, o.yMin, o.yMax))/(o.yMax - o.yMin);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'グラフ')}">`;
  (o.bands||[]).forEach(b => { s += `<rect x="${L}" y="${Y(b.to)}" width="${W-L-R}" height="${Math.max(0, Y(b.from)-Y(b.to))}" fill="${b.color}" opacity="${b.op||.08}"/>`; });
  for(let i=0;i<=4;i++){ const v = o.yMin + (o.yMax-o.yMin)*i/4; s += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+3.5}" text-anchor="end">${o.yFmt ? o.yFmt(v) : v}</text>`; }
  (o.xticks||[]).forEach(kk => { s += `<text x="${X(kk)}" y="${H-7}" text-anchor="middle">${md(kk)}</text>`; });
  (o.vlines||[]).forEach(v => { const x = X(v.key); s += `<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" stroke="${v.color}" stroke-dasharray="${v.dash||'4 3'}"/>${v.label ? `<text x="${x+3}" y="${T+10}" style="fill:${v.color}">${v.label}</text>` : ''}`; });
  o.series.forEach(se => { if(se.pts.length < 2) return; s += `<polyline fill="none" stroke="${se.color}" stroke-width="${se.width||2}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''} points="${se.pts.map(p => X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`; });
  if(o.legend) s += `<g>${o.series.filter(se => se.name).map((se, i) => `<g transform="translate(${L + 8 + i*112},12)"><line x1="0" x2="16" y1="0" y2="0" stroke="${se.color}" stroke-width="2.5" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''}/><text x="20" y="3.5" style="fill:var(--text)">${se.name}</text></g>`).join('')}</g>`;
  return s + '</svg>';
}

  const days = Math.max(0, calDiff('2026-10-21', key));

function renderNav(){

$('#navList').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if(b){ go(b.getAttribute('data-go')); $('#app').classList.remove('mopen'); } });
// 画面遷移はURLの#/画面名と同期する（ブラウザの戻る・進むにも対応）
function go(p){
  showPage(p);
  try{ if(location.hash !== '#/'+p) history.pushState(null, '', '#/'+p); }catch(e){}
}
function pageFromHash(){ const p = (location.hash.match(/^#\/(\w+)/) || [])[1]; return p && PAGES[p] ? p : null; }
window.addEventListener('popstate', () => { const p = pageFromHash(); if(p && S.user) showPage(p); });
window.addEventListener('hashchange', () => { const p = pageFromHash(); if(p && S.user && p !== S.page) showPage(p); });
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#/"]'); if(!a) return; e.preventDefault(); const p = a.getAttribute('href').slice(2); if(PAGES[p]) go(p); });
let curPage = null;
function showPage(p){
  if(!PAGES[p]) p = 'dash';
  S.page = p; curPage = PAGES[p];
  const info = PAGE_INFO[p];
  setHTML($('#crumb'), `<span>${esc(info.group)}</span>${icon('right')}<b>${info.title}</b>`);
  renderNav();
  const el = $('#page'); el.innerHTML = ''; el._h = null;
  curPage.render(el);
  el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
  window.scrollTo({top:0});
}

function filteredSites(){

  const key = {id:r => r.s.id, prog:r => r.prog, spi:r => r.spi, cpi:r => r.cpi, finish:r => r.finish}[S.siteSort.k] || (r => r.s.id);
  return rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * S.siteSort.d);
}
function updSites(){

function updApprovals(){

function openRequest(id){
  const r = S.requests.find(x => x.id === id); if(!r) return;
  const nf = nowInfo(), e = evmAt(nf.key, nf.frac);

    <div class="db">

      ${r.comment ? `<div class="sec"><h3>起案者のコメント</h3><div>${esc(r.comment)}</div></div>` : ''}
      <div class="sec"><h3>判断の根拠（起案時点 ${mdw(r.simDate)} ${r.simTime}）</h3><dl class="kv"><dt>SPI ／ CPI</dt><dd>${f2(r.before.spi)} ／ ${f2(r.before.cpi)}</dd><dt>擁壁工の遅れ</dt><dd>${f1(Math.max(0, r.before.wallDelay))}日</dd><dt>重機稼働率</dt><dd>${r.before.util != null ? pct(r.before.util) : '—'}（BH-01 ${r.before.bh1 != null ? pct(r.before.bh1) : '—'}）</dd></dl></div>
      <div class="sec"><h3>試算</h3><dl class="kv"><dt>完成予測</dt><dd>${mdw(r.before.finish)} → <b>${mdw(r.after.finish)}</b>（契約 ${mdw(CONTRACT)}）</dd><dt>擁壁工の完了</dt><dd>${mdw(r.after.wallFinish)}</dd><dt>最終原価見込み</dt><dd>${man(r.before.eac)} → <b>${man(r.after.eac)}</b></dd><dt>対策費</dt><dd>${man(r.after.cost)}</dd></dl></div>
      ${d ? `<div class="sec"><h3>効果の検証</h3>${!d.archived && d.scn === S.scn && nf.key >= d.effective ? `SPI ${f2(d.before.spi)} → <b>${f2(e.SPI)}</b>（${mdw(nf.key)}時点）<br>現在の完成予測 ${mdw(FC.finish)}（承認時の試算 ${mdw(d.after.finish)}）` : !d.archived && d.scn === S.scn ? mdw(d.effective)+' から反映されます' : 'リセット前の記録です'}</div>` : ''}
      <div class="sec"><h3>履歴</h3><ul class="tl">${r.history.map(h => `<li class="${h.action === '承認' ? 'ok' : h.action === '差戻し' ? 'ng' : ''}"><b>${h.action}</b> ${esc(h.by)} <span class="muted" style="font-size:12px">${mdw(h.sim.slice(0,10))} ${h.sim.slice(11)}</span>${h.comment ? `<br><span style="font-size:12px">${esc(h.comment)}</span>` : ''}</li>`).join('')}</ul></div>
    </div>
    <div class="df">${canAct ? `<textarea class="in" id="apC" placeholder="承認・差戻しのコメント（差戻しの場合は必須）"></textarea><div class="fld"><span class="err" id="apErr"></span></div><div class="acts"><button class="btn ok" id="apOk" type="button">承認する</button><button class="btn ng" id="apNg" type="button">差戻す</button></div>`
      : r.status !== 'pending' ? '<span class="muted">この申請は処理済みです</span>'
      : !can('approve') ? lockNote('approve')
      : isOwnRequest(r) ? `<span class="lock">${icon('lock')} 自分が起案した申請は承認・差戻しできません（職務分掌）。他の承認者が判断します</span>`
      : '<span class="muted">シナリオが異なるため操作できません</span>'}</div>`);
  if(canAct){
    $('#apOk').addEventListener('click', () => decide(r.id, true, $('#apC').value.trim()));
    $('#apNg').addEventListener('click', () => { const c = $('#apC').value.trim(); if(!c){ $('#apErr').textContent = '差戻しの理由を入力してください'; return; } decide(r.id, false, c); });
  }
}
function beforeSnapshot(){
  const nf = nowInfo(), e = evmAt(nf.key, nf.frac), u = todayUtil();
  return {spi:e.SPI, cpi:e.CPI, wallDelay:taskDelay('wall', nf.key, nf.frac), util:u.avg, bh1:u.bh1, finish:FC.finish, eac:FC.eac};
}
function decide(id, ok, comment){
  const r = S.requests.find(x => x.id === id); if(!r || !canDecide(r)) return;
  const nf = nowInfo();
  r.status = ok ? 'approved' : 'rejected';
  r.history.push({at:new Date().toISOString(), sim:nf.key+' '+nf.hm, by:me().name, action: ok ? '承認' : '差戻し', comment});
  if(ok){
    const cand = forecast(new Set(r.options));
    const d = {id:Date.now(), ts:new Date().toISOString(), scn:S.scn, simDate:nf.key, simTime:nf.hm, effective:nf.tomorrow, approver:me().name, comment: comment || r.comment, options:r.options.slice(),
      before:beforeSnapshot(), after:{finish:cand.finish, eac:cand.eac, wallFinish:cand.sp.wall.f, cost:cand.optAdd - FC.optAdd}, reqId:r.id};
    S.decisions.push(d); r.decisionId = d.id;
    recompute();
  }
  audit(ok ? '承認' : '差戻し', r.id, r.title + (comment ? '／' + comment : ''));
  notify(`${r.id}「${r.title}」が${ok ? '承認' : '差し戻し'}されました`, ok ? 'ok' : 'warn', 'approvals');
  save(); closeOverlay(); renderNav(); updApprovals();
  toast(ok ? '承認しました。翌稼働日（'+mdw(nextWorkKey(nf.key))+'）から現場に反映されます' : '差し戻しました');
}

/* ================= ページ：レポート（週報） ================= */
function weekList(){
  const nf = nowInfo(), out = []; let d = parseK('2026-09-28');
  while(k(d) <= nf.key){ out.push(k(d)); d = addDays(d, 7); }
  return out.reverse();
}
let repWeek = null;
function renderReports(el){
  const weeks = weekList(); if(!repWeek || weeks.indexOf(repWeek) < 0) repWeek = weeks[0];
  el.innerHTML = head('レポート', 'A現場の週報を自動で作成します。印刷やPDF保存にも対応しています',
    `<select class="in" id="rW">${weeks.map(w => `<option value="${w}" ${w === repWeek ? 'selected' : ''}>${md(w)}〜${md(k(addDays(parseK(w),6)))} の週</option>`).join('')}</select><button class="btn sub" type="button" id="rCsv">CSV出力</button><button class="btn" type="button" id="rPrint">印刷・PDF</button>`) + `<div id="rBody"></div>`;
  el.querySelector('#rW').addEventListener('change', e => { repWeek = e.target.value; updReports(true); });
  el.querySelector('#rPrint').addEventListener('click', () => { audit('印刷', '週報 '+repWeek); window.print(); });
  el.querySelector('#rCsv').addEventListener('click', () => { download('weekly-'+repWeek+'.csv', csvOf(weekRows().map(x => [x.key, x.weather, x.workers, x.works, Math.round(x.ev)])), 'text/csv'); audit('CSV出力', '週報 '+repWeek); });
  updReports(true);
}
function weekRows(){
  const s = repWeek, e = k(addDays(parseK(repWeek), 6)), nf = nowInfo();
  return ACT.recs.filter(r => r.key >= s && r.key <= e && r.key < nf.key).map(autoDaily);
}
function updReports(force){
  if(!$('#rBody') || (!force && !dirty.all)) return;
  const nf = nowInfo(), s = repWeek, e = k(addDays(parseK(repWeek), 6));
  const endKey = e < nf.key ? e : nf.key, frac = e < nf.key ? 1 : nf.frac;
  const ev1 = evmAt(endKey, frac), st0 = stateAt(ACT.recs, k(addDays(parseK(s), -1)), 1).prog, st1 = stateAt(ACT.recs, endKey, frac).prog, pl1 = stateAt(PLAN.recs, endKey, frac).prog;
  const evs = ALERTS.filter(a => a.key >= s && a.key <= e);
  const decs = S.decisions.filter(d => !d.archived && d.scn === S.scn && d.simDate >= s && d.simDate <= e);
  const ns = k(addDays(parseK(s), 7)), ne = k(addDays(parseK(s), 13));

function sensorAt(key, h){
  const q = Math.floor(h*4), n = s => hash(key+s+q) - .5, day = Math.max(0, calDiff(START_KEY, key));
  const wbgt = 20.5 - day*.06 + 3.6*Math.sin(Math.PI*clamp((h-8)/9, 0, 1)) + n('w')*1.0;
  let wind = 3.2 + 2*Math.sin(h/2 + hash(key)*6) + n('v')*1.6; if(key === '2026-10-23' && h >= 13 && h < 15) wind += 7.5;
  const noise = 66 + 7*Math.sin(h*1.3 + hash(key)*3) + n('n')*4, vib = 57 + 5*Math.sin(h + hash(key+'b')*4) + n('b')*3;
  return {wbgt, wind:Math.max(0, wind), noise, vib};
}
const SENS = [
  {k:'wbgt', name:'暑さ指数（WBGT）', unit:'℃', warn:25, ng:28, max:32, min:10, fmt:v => v.toFixed(1)},
  {k:'wind', name:'風速', unit:'m/s', warn:8, ng:10, max:16, min:0, fmt:v => v.toFixed(1), note:'10m/s以上でクレーン作業中止'},
  {k:'noise', name:'騒音', unit:'dB', warn:80, ng:85, max:95, min:50, fmt:v => v.toFixed(0), note:'規制基準 85dB'},
  {k:'vib', name:'振動', unit:'dB', warn:70, ng:75, max:85, min:40, fmt:v => v.toFixed(0), note:'規制基準 75dB'},
];
function safetyEvents(){
  if(!ACT) return [];
  const nf = nowInfo(), out = [];
  ACT.recs.filter(r => r.key <= nf.key).forEach(r => {
    if(r.key === nf.key && nf.h < 13) return;
    if(r.key === '2026-10-23' && r.active.indexOf('wall') >= 0) out.push({key:r.key, lv:'warn', text:'強風（最大風速10m/s超）のため、クレーン作業を一時中止しました（13:00〜15:00）'});
    if(hash(r.key+'near') < .18 && r.key < nf.key) out.push({key:r.key, lv:'warn', text:'重機接近警報：'+(r.active.indexOf('wall') >= 0 ? 'BH-02' : 'BH-01')+' の旋回範囲に作業員が接近（自動停止で回避）'});
  });
  return out.sort((a, b) => a.key < b.key ? 1 : -1);
}

  s += SENS.map((c, i) => `<g transform="translate(${L + 6 + i*128},14)"><line x1="0" x2="14" y1="0" y2="0" stroke="${cols[i]}" stroke-width="2.5"/><text x="18" y="3.5" style="fill:var(--text)">${c.name.replace(/（.*/, '')}</text></g>`).join('');
  setHTML($('#yChart'), s + '</svg><p class="note">縦軸は各センサーの基準値に対する割合（赤い点線＝基準値）</p>');

function evSeries(recs, upto){

function taskAC(recs, upto){
  const ac = {}; TASKS.forEach(t => ac[t.id] = 0);
  recs.forEach(r => { if(r.key > upto) return; r.active.forEach(id => { const t = TB[id]; ac[id] += t.dayCost + (r.end[id] - r.start[id])*t.unitCost; }); });

}

    const pv = t.budget*p[t.id]/t.qty, ev = t.budget*a[t.id]/t.qty, acv = ac[t.id]; tB += t.budget; tP += pv; tE += ev; tA += acv;
    return `<tr><td>${t.name}</td><td class="num">${man(t.budget)}</td><td class="num">${man(pv)}</td><td class="num">${man(ev)}</td><td class="num">${man(acv)}</td><td class="num ${ev - pv < -5 ? 'c-ng' : ''}">${sman(ev - pv)}</td><td class="num ${ev - acv < -5 ? 'c-ng' : ''}">${sman(ev - acv)}</td></tr>`;
  }).join('') + `<tr><td>対策費</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td class="num">${man(e.AC - tA)}</td><td></td><td class="num">${sman(-(e.AC - tA))}</td></tr><tr><th>合計</th><th class="num">${man(tB)}</th><th class="num">${man(tP)}</th><th class="num">${man(tE)}</th><th class="num">${man(e.AC)}</th><th class="num">${sman(tE - tP)}</th><th class="num">${sman(tE - e.AC)}</th></tr></tbody></table>`);
}

/* ================= ページ：設定 ================= */

        <label class="fld"><span>SPI 注意（黄）のしきい値</span><input class="in" id="cfW" type="number" step=".01" min=".5" max="1.2" value="${c.spiWarn}" ${dis}></label>
        <label class="fld"><span>SPI 危険（赤）のしきい値</span><input class="in" id="cfN" type="number" step=".01" min=".3" max="1.2" value="${c.spiNg}" ${dis}></label>

      <div class="card"><div class="ch"><b>通知</b></div>

        <p class="note">本番では、メール・Teams・スマートフォンへのプッシュ通知を想定しています。</p></div></div>
     <div class="g2"><div class="card"><div class="ch"><b>データ連携</b></div>
        <label style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><input type="radio" name="ds" checked ${dis}> オフライン（ブラウザ内シミュレーション）</label>
        <label style="display:flex;gap:8px;align-items:center;margin-bottom:10px" class="muted"><input type="radio" name="ds" disabled> API連携（MVP段階で接続予定）</label>

      <div class="card"><div class="ch"><b>シミュレーション（サンプル環境）</b></div>
        <label class="fld"><span>シナリオ</span><select class="in" id="cfS" ${dis}><option value="delay">遅延（ダンプ不足）</option><option value="normal">順調</option><option value="breakdown">重機故障</option></select></label>
        <p class="note">シナリオを変えると、時刻が10/21 8:00に戻ります。承認済みの対策は「リセット済み」になります。</p>
        ${ro ? '' : '<button class="btn sub" type="button" id="cfInit" style="margin-top:6px">サンプルデータを初期化</button>'}</div></div>
     ${ro ? '' : '<div class="acts"><button class="btn" type="button" id="cfSave">設定を保存</button><span class="err" id="cfErr" style="color:var(--ng);font-size:12px"></span></div>'}`;

/* ================= ページ：監査ログ ================= */
let auU = '', auA = '';
function renderAudit(el){
  el.innerHTML = head('監査ログ', '誰が・いつ・何をしたかを記録します（改ざん防止の保管は本番で対応）', `<button class="btn sub sm" type="button" id="auCsv">CSV出力</button>`) +
    `<div class="card"><div class="filters"><select class="in" id="auU"><option value="">ユーザー：すべて</option>${USERS.map(u => `<option>${u.name}</option>`).join('')}</select><select class="in" id="auA"></select><span class="muted" id="auN" style="font-size:12px"></span></div><div class="tbl" id="auT"></div></div>`;
  el.querySelector('#auU').value = auU;
  el.querySelector('#auU').addEventListener('input', e => { auU = e.target.value; updAudit(); });
  el.querySelector('#auA').addEventListener('input', e => { auA = e.target.value; updAudit(); });
  el.querySelector('#auCsv').addEventListener('click', () => { download('audit-log.csv', csvOf([['日時','シミュレーション日時','ユーザー','ロール','操作','対象','詳細']].concat(S.audit.map(a => [a.ts, a.sim, a.user, a.role, a.action, a.target, a.detail]))), 'text/csv'); audit('CSV出力', '監査ログ'); });
  updAudit();
}
function updAudit(){
  if(!$('#auT')) return;
  const acts = Array.from(new Set(S.audit.map(a => a.action)));
  setHTML($('#auA'), `<option value="">操作：すべて</option>` + acts.map(a => `<option ${a === auA ? 'selected' : ''}>${a}</option>`).join(''));
  const rows = S.audit.filter(a => (!auU || a.user === auU) && (!auA || a.action === auA)).slice().reverse();
  $('#auN').textContent = rows.length + '件';
  setHTML($('#auT'), `<table><thead><tr><th>日時</th><th>シミュレーション日時</th><th>ユーザー</th><th>操作</th><th>対象</th><th>詳細</th></tr></thead><tbody>` + (rows.length ? rows.slice(0, 300).map(a => `<tr><td style="white-space:nowrap">${new Date(a.ts).toLocaleString('ja-JP')}</td><td style="white-space:nowrap">${mdw(a.sim.slice(0,10))} ${a.sim.slice(11)}</td><td>${esc(a.user)}<br><span class="muted" style="font-size:11px">${esc(a.role)}</span></td><td>${pill('info', esc(a.action))}</td><td>${esc(a.target)}</td><td style="font-size:12px">${esc(a.detail)}</td></tr>`).join('') : '<tr><td colspan="6" class="muted">記録はありません</td></tr>') + '</tbody></table>');
}

/* ================= トップバー ================= */
function hidePops(except){ ['#feedPop','#bellPop','#userPop'].forEach(id => { if(id !== except) $(id).hidden = true; }); $('#qDrop').hidden = true; }
function togglePop(id, build){ const p = $(id); const open = p.hidden; hidePops(id); p.hidden = !open; if(open) build(); }
document.addEventListener('click', e => { if(!e.target.closest('.popwrap') && !e.target.closest('.tb-search')) hidePops(); });
$('#btnFeed').addEventListener('click', () => togglePop('#feedPop', buildFeedPop));
function buildFeedPop(){
  setHTML($('#feedPop'), `<h4>データ連携</h4><div class="note" style="margin:0 0 10px">このサンプルはオフラインです。現場データはブラウザ内のシミュレーションで生成しています。</div>
    <div class="acts" style="margin-bottom:8px"><button class="btn sm" id="fpPlay" type="button">${S.playing ? '⏸ 一時停止' : '▶ 再生'}</button><button class="btn sub sm" id="fpNext" type="button">翌稼働日へ ⏭</button></div>
    <div class="seg" id="fpSpeed" style="margin-bottom:10px">${[60,300,1800,7200].map(s => `<button type="button" data-s="${s}" class="${S.speed === s ? 'on' : ''}">×${s}</button>`).join('')}</div>
    <label class="fld"><span>シナリオ</span><select class="in" id="fpScn"><option value="delay">遅延（ダンプ不足）</option><option value="normal">順調</option><option value="breakdown">重機故障</option></select></label>
    <div class="acts" style="align-items:center"><button class="btn sub sm" id="fpReset" type="button" ${can('settings') ? '' : 'disabled'}>10/21 8:00 にリセット</button>${can('settings') ? '' : lockNote('settings')}</div>`);
  $('#fpScn').value = S.scn; $('#fpScn').disabled = !can('settings');
  $('#fpPlay').addEventListener('click', () => { S.playing = !S.playing; buildFeedPop(); });
  $('#fpNext').addEventListener('click', gotoNextDay);
  $('#fpSpeed').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if(b){ S.speed = +b.getAttribute('data-s'); save(); buildFeedPop(); } });
  $('#fpScn').addEventListener('change', e => { if(!can('settings')) return; S.scn = e.target.value; resetSim(); audit('シナリオ変更', S.scn); toast('シナリオを切り替えました（10/21 8:00から）'); buildFeedPop(); });
  $('#fpReset').addEventListener('click', () => { if(!can('settings')) return; resetSim(); audit('シミュレーションのリセット', '10/21 8:00'); toast('10/21 8:00に戻しました'); buildFeedPop(); });
}
$('#btnBell').addEventListener('click', () => togglePop('#bellPop', buildBellPop));
function buildBellPop(){
  const list = allNotifs().slice(0, 20), read = new Set(S.notifRead);
  setHTML($('#bellPop'), `<div style="display:flex;justify-content:space-between;align-items:center"><h4>通知</h4><button class="btn sub sm" id="bpAll" type="button">すべて既読にする</button></div>
    <div class="nlist">${list.length ? list.map(n => `<div class="nrow ${read.has(n.id) ? '' : 'unread'}" data-n="${esc(n.id)}" data-l="${n.link}">${pill(n.lv === 'info' ? 'info' : n.lv, lvName(n.lv))}<div style="flex:1;min-width:0">${esc(n.text)}<div class="d">${mdw(n.key)}</div></div></div>`).join('') : '<div class="empty">通知はありません</div>'}</div>`);
  $('#bpAll').addEventListener('click', () => { S.notifRead = allNotifs().map(n => n.id).slice(0, 400); save(); buildBellPop(); updBell(); });
  $('#bellPop').querySelectorAll('[data-n]').forEach(r => r.addEventListener('click', () => { const id = r.getAttribute('data-n'); if(S.notifRead.indexOf(id) < 0) S.notifRead.push(id); if(S.notifRead.length > 400) S.notifRead.shift(); save(); hidePops(); go(r.getAttribute('data-l')); updBell(); }));
}
function updBell(){ const read = new Set(S.notifRead), n = allNotifs().filter(x => !read.has(x.id)).length; const b = $('#bellN'); b.hidden = !n; b.textContent = n > 99 ? '99+' : n; }
$('#btnUser').addEventListener('click', () => togglePop('#userPop', () => {
  const u = me();
  setHTML($('#userPop'), `<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><span class="av">${u.ini}</span><div><b>${u.name}</b><div class="muted" style="font-size:12px">${u.org} ／ ${ROLE_NAME[u.role]}</div></div></div>
    <div class="note" style="margin:0 0 10px">できること：${Object.keys(PERM_NAME).filter(p => can(p)).map(p => PERM_NAME[p]).join('、')}</div>
    <div class="acts"><button class="btn sub sm" id="upTheme" type="button">表示テーマを切替</button><button class="btn sub sm" id="upOut" type="button">ログアウト</button></div>`);
  $('#upTheme').addEventListener('click', () => { const r = document.documentElement, cur = r.getAttribute('data-theme'); const nx = !cur ? (isDark() ? 'light' : 'dark') : cur === 'dark' ? 'light' : 'dark'; r.setAttribute('data-theme', nx); try{ localStorage.setItem('slt-theme', nx); }catch(e){} if(curPage) showPage(S.page); });
  $('#upOut').addEventListener('click', () => { audit('ログアウト', me().name); S.user = null; save(); hidePops(); showLogin(); });
}));
$('#btnCollapse').addEventListener('click', () => { S.collapsed = !S.collapsed; $('#app').classList.toggle('collapsed', S.collapsed); save(); });
$('#btnMenu').addEventListener('click', () => $('#app').classList.toggle('mopen'));

/* 検索 */
function searchIndex(){
  const items = [];
  NAV.forEach(g => g.items.forEach(it => items.push({t:it[1], sub:'画面', go:() => go(it[0])})));
  SITES.forEach(s => items.push({t:s.id+'現場 '+s.name, sub:'現場', go:() => openSite(s.id)}));
  MACHINES.forEach(m => items.push({t:m.id+' '+m.name, sub:'重機', go:() => { S.sel = m.id; go('twin'); }}));
  TASKS.forEach(t => items.push({t:t.name, sub:'工種', go:() => go('schedule')}));
  S.requests.forEach(r => items.push({t:r.id+' '+r.title, sub:'申請', go:() => { go('approvals'); setTimeout(() => openRequest(r.id), 50); }}));
  return items;
}
let qHits = [], qSel = 0;
$('#q').addEventListener('input', () => {
  const q = $('#q').value.trim(); if(!q){ $('#qDrop').hidden = true; return; }
  qHits = searchIndex().filter(x => x.t.toLowerCase().indexOf(q.toLowerCase()) >= 0).slice(0, 10); qSel = 0;
  setHTML($('#qDrop'), qHits.length ? qHits.map((x, i) => `<button type="button" data-i="${i}" class="${i === 0 ? 'hl' : ''}">${esc(x.t)}<small>${x.sub}</small></button>`).join('') : '<div class="empty" style="padding:14px">見つかりませんでした</div>');
  $('#qDrop').hidden = false;
});
$('#q').addEventListener('keydown', e => {
  if($('#qDrop').hidden || !qHits.length) return;
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); qSel = (qSel + (e.key === 'ArrowDown' ? 1 : qHits.length - 1)) % qHits.length; $('#qDrop').querySelectorAll('button').forEach((b, i) => b.classList.toggle('hl', i === qSel)); }
  if(e.key === 'Enter'){ e.preventDefault(); const h = qHits[qSel]; $('#q').value = ''; $('#qDrop').hidden = true; h.go(); }
});
$('#qDrop').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if(!b) return; const h = qHits[+b.getAttribute('data-i')]; $('#q').value = ''; $('#qDrop').hidden = true; h.go(); });

/* ================= 時間の進行 ================= */
function nextWorkKey(key){ let d = addDays(parseK(key), 1); for(let g=0; g<14; g++){ if(isWorkday(d, activeOpts(k(d)).has('sat'))) break; d = addDays(d,1); } return k(d); }
function gotoNextDay(){
  const nf = nowInfo(), nk = nextWorkKey(nf.key);
  if(nk > END_KEY){ S.playing = false; toast('サンプルの期間（12/31）の終わりに達しました'); return; }
  const d = parseK(nk); S.t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 8, 0).getTime();
  recompute(); save();
}
function advance(ms){ const d = new Date(S.t), end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 17, 0).getTime(); if(S.t + ms >= end) gotoNextDay(); else S.t += ms; }
function resetSim(){
  S.decisions.forEach(d => d.archived = true);
  S.requests.forEach(r => { if(r.status === 'pending'){ r.status = 'withdrawn'; r.history.push({at:new Date().toISOString(), sim:nowInfo().key+' '+nowInfo().hm, by:'システム', action:'取下げ', comment:'シミュレーションのリセットにより取下げ'}); } });
  S.t = DEFAULT_T; S.sel = null; S.whatif = new Set(['dump','crew']); S.notifRead = [];
  recompute(); save(); if(curPage) showPage(S.page);
}
function updFeed(){
  const nf = nowInfo();
  setHTML($('#feedTxt'), `${mdw(nf.key)} <b>${nf.hm}</b> <small>${S.playing ? 'ライブ（×'+S.speed+'）' : '一時停止中'}</small>`);
  $('#btnFeed').classList.toggle('off', !S.playing);
}

/* ================= ログイン ================= */
let loginSel = 'exec';
function showLogin(){
  $('#app').hidden = true; $('#login').hidden = false;
  setHTML($('#accList'), USERS.map(u => `<label class="acc ${u.id === loginSel ? 'on' : ''}"><input type="radio" name="acc" value="${u.id}" ${u.id === loginSel ? 'checked' : ''}><span class="av">${u.ini}</span><span><b>${u.name}</b><small>${u.org} ／ ${ROLE_NAME[u.role]} ／ ${Object.keys(PERM_NAME).filter(p => PERM[p].indexOf(u.role) >= 0).map(p => PERM_NAME[p]).join('・')}</small></span></label>`).join(''));
}
$('#accList').addEventListener('change', e => { loginSel = e.target.value; showLogin(); });
$('#btnLogin').addEventListener('click', () => { S.user = loginSel; audit('ログイン', me().name); save(); startApp(); });
function startApp(){
  const u = me();
  $('#login').hidden = true; $('#app').hidden = false;
  $('#app').classList.toggle('collapsed', !!S.collapsed);
  $('#uAv').textContent = u.ini; $('#uName').textContent = u.name; $('#uRole').textContent = ROLE_NAME[u.role] + ' ／ ' + u.org;
  const p = pageFromHash();
  if(p) showPage(p); else go(u.role === 'exec' ? 'dash' : u.role === 'admin' ? 'settings' : 'overview');
  updBell(); updFeed();
}

/* ================= 起動 ================= */
(function init(){
  try{ const th = localStorage.getItem('slt-theme'); if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}
  $('#btnMenu').innerHTML = icon('menu'); $('#icBell').innerHTML = icon('bell'); $('#icSearch').innerHTML = icon('search'); $('#icCollapse').innerHTML = icon('left');
  const d = new Date(S.t);
  if(!isWorkday(d, activeOpts(k(d)).has('sat')) || d.getHours() >= 17){ const nd = parseK(nextWorkKey(k(d))); S.t = new Date(nd.getFullYear(), nd.getMonth(), nd.getDate(), 8, 0).getTime(); }
  else if(d.getHours() < 8){ S.t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 8, 0).getTime(); }
  recompute();
  if(S.user && me()) startApp(); else showLogin();
})();

let lastT = performance.now(), lastUI = 0, lastSave = 0;
function frame(now){
  const dt = Math.min(.1, (now - lastT)/1000); lastT = now;
  if(S.user){
    if(S.playing) advance(dt * S.speed * 1000);
    if(S.page === 'twin' && vTwin) drawTwin(now/1000);
    if(S.page === 'schedule' && vPlan){
      if(S.play4d && now - last4d > 260){ last4d = now; const v = +$('#r4').value; if(v >= G.days - 1){ S.play4d = false; $('#b4Play').textContent = '▶ 再生'; } else { $('#r4').value = v + 1; on4dChange(); } }
      draw4d();
    }
    if(now - lastUI > 300){
      lastUI = now; updFeed();
      if(curPage) curPage.tick();
      if(dirty.all){ renderNav(); updBell(); }
      dirty.all = false;
    }
    if(now - lastSave > 3000){ lastSave = now; save(); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.SLT = {S, get ACT(){return ACT;}, get FC(){return FC;}, evmAt, taskDelay, forecast, go, decide, CONTRACT};
})();
